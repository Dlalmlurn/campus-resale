services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_resale}
      POSTGRES_USER: ${POSTGRES_USER:-campus_resale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_resale_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_resale} -d ${POSTGRES_DB:-campus_resale}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campus_resale_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campus_resale_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      CAMPUS_RESALE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campus_resale}
      CAMPUS_RESALE_DB_USERNAME: ${POSTGRES_USER:-campus_resale}
      CAMPUS_RESALE_DB_PASSWORD: ${POSTGRES_PASSWORD:-campus_resale_dev_password}
      CAMPUS_RESALE_CORS_ALLOWED_ORIGINS: ${CAMPUS_RESALE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      CAMPUS_RESALE_STORAGE_ENDPOINT: http://minio:9000
      CAMPUS_RESALE_STORAGE_BUCKET: ${MINIO_BUCKET:-campus-resale-dev}
      CAMPUS_RESALE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-campus_resale_minio}
      CAMPUS_RESALE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-campus_resale_minio_password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
